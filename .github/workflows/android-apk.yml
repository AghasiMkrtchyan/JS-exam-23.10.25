name: Build Armenian Expenses APK
on:
  push:
    branches: [android-expenses-apk]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish APK for direct download
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/Im_Caxsery_Android_v1.0.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/Im_Caxsery_Android_v1.0.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Android installer APK'
            git push origin HEAD:android-expenses-apk
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Im-Caxsery-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
