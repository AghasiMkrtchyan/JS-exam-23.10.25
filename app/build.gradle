plugins { id 'com.android.application' }

android {
    namespace 'am.imcaxsery.app'
    compileSdk 35
    defaultConfig {
        applicationId 'am.imcaxsery.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
